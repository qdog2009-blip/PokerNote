# PokerNote Nginx + PHP 7.4 configuration
# Adjust the root path if the project is installed elsewhere.

server {
    listen 80;
    listen 443 ssl http2;
    server_name p.txtcc.com;

    ssl_certificate ssl/star.txtcc.com.cer;
    ssl_certificate_key ssl/star.txtcc.com.key;

    charset utf-8;
    root /serverdata/wwwroot/PokerNote/public;
    index index.php index.html index.htm;

    access_log /serverdata/logs/nginx/p_access.log main;
    error_log /serverdata/logs/nginx/p_error.log;

    client_max_body_size 2m;

    # All API paths are handled by the PHP front controller.
    location = /api {
        rewrite ^ /index.php last;
    }

    location ^~ /api/ {
        rewrite ^ /index.php last;
    }

    # Use an app-specific PHP entry point so the shared php7.inc can remain unchanged.
    # API errors must keep their JSON bodies instead of being replaced by common HTML error pages.
    location = /index.php {
        fastcgi_pass php7-handler;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_intercept_errors off;
        include fastcgi_params;
    }

    # Always render the app shell through PHP so asset content hashes are refreshed automatically.
    location = / {
        rewrite ^ /index.php last;
    }

    location = /index.html {
        rewrite ^ /index.php last;
    }

    # Serve existing frontend assets directly; fall back to the PHP-rendered app shell.
    location / {
        try_files $uri $uri/ /index.php;
    }

    # The shared php7.inc only needs to point to PHP 7.4 FPM; no changes are required.
    include php7.inc;
    include common.inc;
}
