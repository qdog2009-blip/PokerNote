# PokerNote Nginx + PHP 7.4 configuration
# Adjust the root path if the project is installed elsewhere.

server {
    listen 80;
    listen 443 ssl http2;
    server_name p.txtcc.com;

    ssl_certificate ssl/star.txtcc.com.cer;
    ssl_certificate_key ssl/star.txtcc.com.key;

    charset utf-8;
    root /serverdata/wwwroot/nick/PokerNote/public;
    index index.html index.htm index.php;

    client_max_body_size 2m;

    # All API paths are handled by the PHP front controller.
    location = /api {
        rewrite ^ /index.php last;
    }

    location ^~ /api/ {
        rewrite ^ /index.php last;
    }

    # Serve existing frontend assets directly; fall back to the main page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    # The shared php7.inc only needs to point to PHP 7.4 FPM; no changes are required.
    include php7.inc;
    include common.inc;
}
